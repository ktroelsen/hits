<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A vinyl record on the brand gradient tile (pink → purple → cyan, bottom-left → top-right):
       black disc with grooves and a light sheen, gradient label and a spindle hole. -->
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="0.5" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <circle cx="32" cy="32" r="27" fill="#0f0f14"/>
  <g fill="none" stroke="#3a3a48" stroke-width="0.8">
    <circle cx="32" cy="32" r="24"/>
    <circle cx="32" cy="32" r="21"/>
    <circle cx="32" cy="32" r="18"/>
    <circle cx="32" cy="32" r="15"/>
  </g>
  <!-- Sheen: two opposite light wedges -->
  <path d="M32 32 L14 11 A27 27 0 0 1 25 5.9 Z M32 32 L50 53 A27 27 0 0 1 39 58.1 Z" fill="#fff" opacity="0.14"/>
  <circle cx="32" cy="32" r="10" fill="url(#label)"/>
  <circle cx="32" cy="32" r="2.5" fill="#0f0f14"/>
</svg>

name: Bake iTunes previews

# Pre-resolves every song's preview + artwork URL from the iTunes Search API and
# writes them into src/data/songs.ts, so the deployed app makes no runtime calls
# to the rate-limited search endpoint. Apple's preview URLs can expire over time,
# so this runs on a schedule and opens a PR whenever the baked URLs change.
#
# Safe by design: if the runner's IP is throttled (some CI IPs get 403), the bake
# script waits out the rate-limit window and leaves any unverifiable song
# untouched — so a bad run makes no changes and simply opens no PR.

on:
  schedule:
    - cron: '17 4 * * 1'   # every Monday at 04:17 UTC
  workflow_dispatch: {}      # allow manual runs

permissions:
  contents: write
  pull-requests: write

# Never run two bakes at once (they'd fight over the same branch).
concurrency:
  group: bake-previews
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Bake previews
        run: npm run bake-songs

      - name: Typecheck (lint)
        run: npm run lint

      - name: Open PR with refreshed previews
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: refresh baked iTunes preview URLs'
          title: 'chore: refresh baked iTunes preview URLs'
          body: |
            Automated refresh of `previewUrl` / `artworkUrl` in `src/data/songs.ts`
            via `npm run bake-songs`.

            Apple's preview URLs expire over time, so this keeps production serving
            valid previews without any runtime calls to the rate-limited search API.

            No changes here means the current baked URLs are still valid.
          branch: chore/bake-previews
          delete-branch: true
          add-paths: src/data/songs.ts
